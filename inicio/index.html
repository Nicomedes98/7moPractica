<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistemas automáticos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #050b16;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    /* =========================
       DIAPOSITIVAS
    ========================= */

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      background: #050b16;
    }

    .slide.active {
      display: block;
    }

    /* =========================
       IMÁGENES
    ========================= */

    .image-slide img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* =========================
       FLECHAS
    ========================= */

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;

      width: 74px;
      height: 74px;

      border: 2px solid rgba(255,255,255,.35);
      border-radius: 50%;

      background: rgba(0,0,0,.42);
      color: white;

      font-size: 46px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .left {
      left: 24px;
    }

    .right {
      right: 24px;
    }

    /* =========================
       CONTADOR
    ========================= */

    .counter {
      position: absolute;

      right: 26px;
      bottom: 22px;

      z-index: 20;

      color: white;

      background: rgba(0,0,0,.4);

      border-radius: 999px;

      padding: 8px 14px;

      font-weight: 700;
      font-size: 14px;
    }

    /* =========================
       PANTALLA FINAL
    ========================= */

    .final-slide {
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(30,108,210,.40),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #071326 0%,
          #0d2f59 52%,
          #071326 100%
        );

      color: white;

      display: none;
    }

    .final-slide.active {
      display: flex;

      align-items: center;
      justify-content: center;

      padding: 35px 92px;
    }

    .final-wrap {
      width: min(1220px, 100%);
    }

    .eyebrow {
      display: inline-block;

      font-size: 22px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 2px;

      color: #9dccff;

      margin-bottom: 14px;
    }

    .question {
      font-size: clamp(
        34px,
        4vw,
        58px
      );

      line-height: 1.08;

      font-weight: 800;

      margin:
        0
        0
        24px
        0;
    }

    .ideas-label {
      font-size: 24px;
      font-weight: 700;

      margin-bottom: 10px;

      color: #d8ebff;
    }

    /* =========================
       CAMPO PARA ESCRIBIR
    ========================= */

    .idea-input {
      width: 100%;

      border: 3px solid #8fc6ff;

      border-radius: 16px;

      padding:
        16px
        20px;

      font-family: inherit;

      font-size: 27px;
      font-weight: 600;

      color: #14263d;

      background: white;

      outline: none;

      margin-bottom: 16px;
    }

    /* =========================
       IDEAS CARGADAS
    ========================= */

    .ideas-container {
      display: flex;

      flex-direction: column;

      gap: 10px;

      max-height: 290px;

      overflow-y: auto;

      padding-right: 5px;
    }

    .idea-card {
      background: white;

      color: #12345a;

      border-left:
        9px solid
        #4da3ff;

      border-radius: 14px;

      padding:
        13px
        18px;

      font-size: 26px;

      font-weight: 700;

      line-height: 1.2;
    }

    .hint {
      margin-top: 12px;

      color: #9dccff;

      font-size: 15px;

      opacity: .9;
    }

  </style>
</head>

<body>

  <!-- =====================================
       PANTALLA 1
       PUERTA AUTOMÁTICA
  ====================================== -->

  <section class="slide image-slide active">

    <img
      src="puerta_automatica.png"
      alt="Puerta automática"
    >

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      1 / 5
    </div>

  </section>


  <!-- =====================================
       PANTALLA 2
       BARRERA DE TREN
  ====================================== -->

  <section class="slide image-slide">

    <img
      src="barrera_tren.png"
      alt="Barrera de tren"
    >

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      2 / 5
    </div>

  </section>


  <!-- =====================================
       PANTALLA 3
       BARRERA DE ESTACIONAMIENTO
  ====================================== -->

  <section class="slide image-slide">

    <img
      src="barrera_estacionamiento.png"
      alt="Barrera de estacionamiento"
    >

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      3 / 5
    </div>

  </section>


  <!-- =====================================
       PANTALLA 4
       VENTANA CON ALARMA
  ====================================== -->

  <section class="slide image-slide">

    <img
      src="alarma_ventana.png"
      alt="Ventana con alarma"
    >

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      4 / 5
    </div>

  </section>


  <!-- =====================================
       PANTALLA 5
       PENSEMOS
  ====================================== -->

  <section class="slide final-slide">

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>


    <div class="final-wrap">

      <div class="eyebrow">
        PENSEMOS
      </div>


      <h1 class="question">

        ¿Cómo hacen estos dispositivos
        para detectar lo que ocurre
        y decidir qué respuesta dar?

      </h1>


      <div class="ideas-label">
        Ideas del grupo
      </div>


      <input
        type="text"
        id="ideaInput"
        class="idea-input"
        autocomplete="off"
      >


      <div
        id="ideasContainer"
        class="ideas-container"
      ></div>


      <div class="hint">
        Escribimos una idea y presionamos Enter.
      </div>

    </div>


    <div class="counter">
      5 / 5
    </div>

  </section>


  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>

    const slides =
      [
        ...document
          .querySelectorAll(
            ".slide"
          )
      ];


    let current = 0;


    /* =========================
       MOSTRAR DIAPOSITIVA
    ========================= */

    function showSlide(index) {

      slides[current]
        .classList
        .remove(
          "active"
        );


      current =
        Math.max(
          0,
          Math.min(
            index,
            slides.length - 1
          )
        );


      slides[current]
        .classList
        .add(
          "active"
        );

    }


    /* =========================
       SIGUIENTE
    ========================= */

    function nextSlide() {

      if (
        current <
        slides.length - 1
      ) {

        showSlide(
          current + 1
        );

      }

    }


    /* =========================
       ANTERIOR
    ========================= */

    function prevSlide() {

      if (
        current >
        0
      ) {

        showSlide(
          current - 1
        );

      }

    }


    const ideaInput =
      document.getElementById(
        "ideaInput"
      );


    const ideasContainer =
      document.getElementById(
        "ideasContainer"
      );


    /* =========================
       FLECHAS DEL TECLADO
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        /*
        Si estamos escribiendo,
        no cambiar de pantalla
        */

        if (
          document.activeElement
          ===
          ideaInput
        ) {

          return;

        }


        if (
          event.key
          ===
          "ArrowRight"
          ||
          event.key
          ===
          "PageDown"
        ) {

          nextSlide();

        }


        if (
          event.key
          ===
          "ArrowLeft"
          ||
          event.key
          ===
          "PageUp"
        ) {

          prevSlide();

        }

      }
    );


    /* =========================
       RECUPERAR IDEAS GUARDADAS
    ========================= */

    function cargarIdeas() {

      const guardado =
        localStorage.getItem(
          "ideas_inicio_microbit"
        );


      if (
        !guardado
      ) {

        return [];

      }


      try {

        const parsed =
          JSON.parse(
            guardado
          );


        if (
          Array.isArray(
            parsed
          )
        ) {

          return parsed;

        }


        if (
          typeof parsed
          ===
          "string"
          &&
          parsed.trim()
          !==
          ""
        ) {

          return [
            parsed.trim()
          ];

        }

      }

      catch(error) {

        /*
        Si antes estaba guardado
        como texto común
        */

        if (
          guardado.trim()
          !==
          ""
        ) {

          return [
            guardado.trim()
          ];

        }

      }


      return [];

    }


    let ideasGuardadas =
      cargarIdeas();


    /*
    Guardamos todo en
    el nuevo formato
    */

    localStorage.setItem(
      "ideas_inicio_microbit",
      JSON.stringify(
        ideasGuardadas
      )
    );


    /* =========================
       MOSTRAR IDEAS
    ========================= */

    function mostrarIdeas() {

      ideasContainer
        .innerHTML =
        "";


      ideasGuardadas
        .forEach(
          function(idea) {

            const tarjeta =
              document
                .createElement(
                  "div"
                );


            tarjeta
              .className =
              "idea-card";


            tarjeta
              .textContent =
              idea;


            ideasContainer
              .appendChild(
                tarjeta
              );

          }
        );


      /*
      Mostrar siempre
      la última respuesta
      */

      ideasContainer
        .scrollTop =
        ideasContainer
          .scrollHeight;

    }


    /* =========================
       ENTER = AGREGAR IDEA
    ========================= */

    ideaInput
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key
            ===
            "Enter"
          ) {

            event
              .preventDefault();


            const nuevaIdea =
              ideaInput
                .value
                .trim();


            if (
              nuevaIdea
              !==
              ""
            ) {

              /*
              Agregar idea
              */

              ideasGuardadas
                .push(
                  nuevaIdea
                );


              /*
              Guardar
              */

              localStorage
                .setItem(
                  "ideas_inicio_microbit",
                  JSON.stringify(
                    ideasGuardadas
                  )
                );


              /*
              Limpiar campo
              */

              ideaInput
                .value =
                "";


              /*
              Mostrar tarjetas
              */

              mostrarIdeas();

            }

          }

        }
      );


    /*
    Mostrar las ideas
    que ya estaban guardadas
    */

    mostrarIdeas();

  </script>

</body>
</html>
