<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistemas automáticos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #050b16;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      background: #050b16;
    }

    .slide.active {
      display: block;
    }

    .image-slide img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 74px;
      height: 74px;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 50%;
      background: rgba(0,0,0,.42);
      color: white;
      font-size: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .left {
      left: 24px;
    }

    .right {
      right: 24px;
    }

    .counter {
      position: absolute;
      right: 26px;
      bottom: 22px;
      z-index: 20;
      color: white;
      background: rgba(0,0,0,.4);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 14px;
    }

    .final-slide {
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(30,108,210,.40),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #071326 0%,
          #0d2f59 52%,
          #071326 100%
        );

      color: white;
      display: none;
    }

    .final-slide.active {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 92px;
    }

    .final-wrap {
      width: min(1220px, 100%);
    }

    .eyebrow {
      display: inline-block;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9dccff;
      margin-bottom: 14px;
    }

    .question {
      font-size: clamp(34px, 4vw, 58px);
      line-height: 1.08;
      font-weight: 800;
      margin: 0 0 24px 0;
    }

    .ideas-label {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #d8ebff;
    }

    .idea-input {
      width: 100%;
      border: 3px solid #8fc6ff;
      border-radius: 16px;
      padding: 16px 20px;
      font-family: inherit;
      font-size: 27px;
      font-weight: 600;
      color: #14263d;
      background: white;
      outline: none;
      margin-bottom: 16px;
    }

    .ideas-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 275px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .idea-card {
      background: white;
      color: #12345a;
      border-left: 9px solid #4da3ff;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .idea-text {
      flex: 1;
    }

    .delete-idea {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #dc3545;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .delete-idea:hover {
      background: #b02a37;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 13px;
    }

    .clear-btn {
      background: #b02a37;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 17px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-btn:hover {
      background: #8f202b;
    }

    .hint {
      margin-top: 8px;
      color: #9dccff;
      font-size: 15px;
      opacity: .9;
    }

  </style>
</head>

<body>

  <!-- PANTALLA 1 -->

  <section class="slide image-slide active">

    <img
      src="puerta_automatica.png"
      alt="Puerta automática"
    >

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      1 / 5
    </div>

  </section>


  <!-- PANTALLA 2 -->

  <section class="slide image-slide">

    <img
      src="barrera_tren.png"
      alt="Barrera de tren"
    >

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      2 / 5
    </div>

  </section>


  <!-- PANTALLA 3 -->

  <section class="slide image-slide">

    <img
      src="barrera_estacionamiento.png"
      alt="Barrera de estacionamiento"
    >

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      3 / 5
    </div>

  </section>


  <!-- PANTALLA 4 -->

  <section class="slide image-slide">

    <img
      src="alarma_ventana.png"
      alt="Ventana con alarma"
    >

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>

    <button
      class="arrow right"
      onclick="nextSlide()"
    >
      ›
    </button>

    <div class="counter">
      4 / 5
    </div>

  </section>


  <!-- PANTALLA 5 -->

  <section class="slide final-slide">

    <button
      class="arrow left"
      onclick="prevSlide()"
    >
      ‹
    </button>

    <div class="final-wrap">

      <div class="eyebrow">
        PENSEMOS
      </div>

      <h1 class="question">
        ¿Cómo hacen estos dispositivos
        para detectar lo que ocurre
        y decidir qué respuesta dar?
      </h1>

      <div class="ideas-label">
        Ideas del grupo
      </div>

      <input
        type="text"
        id="ideaInput"
        class="idea-input"
        autocomplete="off"
      >

      <div
        id="ideasContainer"
        class="ideas-container"
      ></div>

      <div class="actions">
        <button
          class="clear-btn"
          onclick="borrarTodas()"
        >
          Borrar todas las ideas
        </button>
      </div>

      <div class="hint">
        ideas..
      </div>

    </div>

    <div class="counter">
      5 / 5
    </div>

  </section>


  <script>

    const slides =
      [...document.querySelectorAll(".slide")];

    let current = 0;


    function showSlide(index) {

      slides[current]
        .classList
        .remove("active");

      current =
        Math.max(
          0,
          Math.min(
            index,
            slides.length - 1
          )
        );

      slides[current]
        .classList
        .add("active");
    }


    function nextSlide() {

      if (
        current <
        slides.length - 1
      ) {
        showSlide(current + 1);
      }
    }


    function prevSlide() {

      if (current > 0) {
        showSlide(current - 1);
      }
    }


    const ideaInput =
      document.getElementById("ideaInput");

    const ideasContainer =
      document.getElementById("ideasContainer");


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          document.activeElement ===
          ideaInput
        ) {
          return;
        }

        if (
          event.key === "ArrowRight" ||
          event.key === "PageDown"
        ) {
          nextSlide();
        }

        if (
          event.key === "ArrowLeft" ||
          event.key === "PageUp"
        ) {
          prevSlide();
        }

      }
    );


    function cargarIdeas() {

      const guardado =
        localStorage.getItem(
          "ideas_inicio_microbit"
        );

      if (!guardado) {
        return [];
      }

      try {

        const parsed =
          JSON.parse(guardado);

        if (Array.isArray(parsed)) {
          return parsed;
        }

        if (
          typeof parsed === "string" &&
          parsed.trim() !== ""
        ) {
          return [parsed.trim()];
        }

      }

      catch(error) {

        if (
          guardado.trim() !== ""
        ) {
          return [guardado.trim()];
        }

      }

      return [];
    }


    let ideasGuardadas =
      cargarIdeas();


    function guardarIdeas() {

      localStorage.setItem(
        "ideas_inicio_microbit",
        JSON.stringify(
          ideasGuardadas
        )
      );

    }


    function mostrarIdeas() {

      ideasContainer.innerHTML = "";

      ideasGuardadas.forEach(
        function(idea, index) {

          const tarjeta =
            document.createElement("div");

          tarjeta.className =
            "idea-card";


          const texto =
            document.createElement("span");

          texto.className =
            "idea-text";

          texto.textContent =
            idea;


          const borrar =
            document.createElement("button");

          borrar.className =
            "delete-idea";

          borrar.textContent =
            "✕";

          borrar.title =
            "Borrar esta idea";


          borrar.onclick =
            function() {

              ideasGuardadas.splice(
                index,
                1
              );

              guardarIdeas();

              mostrarIdeas();

            };


          tarjeta.appendChild(texto);

          tarjeta.appendChild(borrar);

          ideasContainer.appendChild(
            tarjeta
          );

        }
      );


      ideasContainer.scrollTop =
        ideasContainer.scrollHeight;

    }


    ideaInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          const nuevaIdea =
            ideaInput.value.trim();


          if (
            nuevaIdea !== ""
          ) {

            ideasGuardadas.push(
              nuevaIdea
            );

            guardarIdeas();

            ideaInput.value = "";

            mostrarIdeas();

          }

        }

      }
    );


    function borrarTodas() {

      if (
        ideasGuardadas.length === 0
      ) {
        return;
      }


      const confirmar =
        confirm(
          "¿Querés borrar todas las ideas?"
        );


      if (confirmar) {

        ideasGuardadas = [];

        localStorage.removeItem(
          "ideas_inicio_microbit"
        );

        mostrarIdeas();

      }

    }


    guardarIdeas();

    mostrarIdeas();

  </script>

</body>
</html>
