<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistemas automáticos</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      background:#050b16;
      font-family: Arial, Helvetica, sans-serif;
      overflow:hidden;
    }
    .slide {
      position:absolute;
      inset:0;
      display:none;
      background:#050b16;
    }
    .slide.active { display:block; }

    .image-slide img {
      width:100vw;
      height:100vh;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    .arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      z-index:20;
      width:74px;
      height:74px;
      border:2px solid rgba(255,255,255,.35);
      border-radius:50%;
      background:rgba(0,0,0,.42);
      color:white;
      font-size:46px;
      line-height:1;
      cursor:pointer;
      backdrop-filter: blur(5px);
      box-shadow:0 8px 22px rgba(0,0,0,.35);
      display:flex;
      align-items:center;
      justify-content:center;
      transition:.18s ease;
    }
    .arrow:hover {
      background:rgba(20,90,185,.88);
      transform:translateY(-50%) scale(1.06);
    }
    .left { left:24px; }
    .right { right:24px; }

    .counter {
      position:absolute;
      right:26px;
      bottom:22px;
      z-index:20;
      color:#fff;
      background:rgba(0,0,0,.4);
      border-radius:999px;
      padding:8px 14px;
      font-weight:700;
      letter-spacing:.4px;
      font-size:14px;
      backdrop-filter:blur(5px);
    }

    .final-slide {
      background:
        radial-gradient(circle at 85% 15%, rgba(30,108,210,.40), transparent 28%),
        linear-gradient(135deg, #071326 0%, #0d2f59 52%, #071326 100%);
      color:white;
      display:none;
    }
    .final-slide.active {
      display:flex;
      align-items:center;
      justify-content:center;
      padding:54px 92px;
    }
    .final-wrap {
      width:min(1220px, 100%);
    }
    .eyebrow {
      display:inline-block;
      font-size:20px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:2px;
      color:#9dccff;
      margin-bottom:18px;
    }
    .question {
      font-size:clamp(38px, 4.7vw, 66px);
      line-height:1.08;
      font-weight:800;
      margin:0 0 30px 0;
      text-wrap:balance;
    }
    .ideas-label {
      font-size:22px;
      font-weight:700;
      margin-bottom:10px;
      color:#d8ebff;
    }
    textarea {
      width:100%;
      height:280px;
      resize:none;
      border:0;
      border-radius:22px;
      padding:24px 28px;
      font-family:inherit;
      font-size:clamp(24px, 2.3vw, 34px);
      line-height:1.38;
      color:#14263d;
      background:#ffffff;
      outline:none;
      box-shadow:0 18px 45px rgba(0,0,0,.28);
    }
    textarea::placeholder { color:#8b98a7; }
    .hint {
      margin-top:12px;
      color:#9dccff;
      font-size:15px;
      opacity:.9;
    }

    @media (max-width: 800px) {
      .arrow { width:58px; height:58px; font-size:36px; }
      .left { left:10px; }
      .right { right:10px; }
      .final-slide.active { padding:34px 24px; }
      textarea { height:250px; }
    }
  </style>
</head>
<body>

  <section class="slide image-slide active">
    <img src="imagenes/puerta_automatica.png" alt="Puerta automática">
    <button class="arrow right" aria-label="Siguiente" onclick="nextSlide()">›</button>
    <div class="counter">1 / 5</div>
  </section>

  <section class="slide image-slide">
    <img src="imagenes/barrera_tren.png" alt="Barrera de tren">
    <button class="arrow left" aria-label="Anterior" onclick="prevSlide()">‹</button>
    <button class="arrow right" aria-label="Siguiente" onclick="nextSlide()">›</button>
    <div class="counter">2 / 5</div>
  </section>

  <section class="slide image-slide">
    <img src="imagenes/barrera_estacionamiento.png" alt="Barrera de estacionamiento">
    <button class="arrow left" aria-label="Anterior" onclick="prevSlide()">‹</button>
    <button class="arrow right" aria-label="Siguiente" onclick="nextSlide()">›</button>
    <div class="counter">3 / 5</div>
  </section>

  <section class="slide image-slide">
    <img src="imagenes/alarma_ventana.png" alt="Ventana con alarma">
    <button class="arrow left" aria-label="Anterior" onclick="prevSlide()">‹</button>
    <button class="arrow right" aria-label="Siguiente" onclick="nextSlide()">›</button>
    <div class="counter">4 / 5</div>
  </section>

  <section class="slide final-slide">
    <button class="arrow left" aria-label="Anterior" onclick="prevSlide()">‹</button>
    <div class="final-wrap">
      <div class="eyebrow">Pregunta para pensar</div>
      <h1 class="question">¿Cómo hacen estos dispositivos para darse cuenta de que ocurrió algo y decidir qué respuesta dar?</h1>
      <div class="ideas-label">Ideas del grupo</div>
      <textarea id="ideas" placeholder="Escribí acá los aportes de los estudiantes..."></textarea>
      <div class="hint">Se guarda automáticamente en esta computadora.</div>
    </div>
    <div class="counter">5 / 5</div>
  </section>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    let current = 0;

    function showSlide(index) {
      slides[current].classList.remove('active');
      current = Math.max(0, Math.min(index, slides.length - 1));
      slides[current].classList.add('active');
    }
    function nextSlide(){ if(current < slides.length - 1) showSlide(current + 1); }
    function prevSlide(){ if(current > 0) showSlide(current - 1); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });

    const ideas = document.getElementById('ideas');
    ideas.value = localStorage.getItem('ideas_inicio_microbit') || '';
    ideas.addEventListener('input', () => {
      localStorage.setItem('ideas_inicio_microbit', ideas.value);
    });
  </script>
</body>
</html>
